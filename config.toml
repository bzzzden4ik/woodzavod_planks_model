# Настройки программы measure_boards.py.
# Строки, начинающиеся с #, — комментарии, программа их не читает.
# Числа пишутся с точкой: 12.5, а не 12,5.

[marker]
# Реальная длина красного маркера (планка под лестницей), см.
# По нему задаётся масштаб: пиксели -> сантиметры.
length_cm = 100.0

[boards]
# N — длина нормальной доски, см.
normal_length_cm = 1000.0
# Доска — выброс (слишком короткая), если она короче N на этот процент и более:
# длина <= N * (1 - процент / 100). Пример: N = 1000 см, 10 %  ->  выброс, если <= 900 см.
tolerance_percent = 10.0

[model]
# Обученная модель. В git её нет — она лежит в GitHub Releases (см. README.md, раздел 2).
path = "models/best.pt"
# Откуда скачать модель, если файла нет. Пусто — не скачивать.
# Вид ссылки: https://github.com/bzzzden4ik/woodzavod_planks_model/releases/download/<version>/best.pt
url = "https://github.com/bzzzden4ik/woodzavod_planks_model/releases/download/v1.0.0/best.pt"
# Контрольная сумма файла модели (SHA-256): так проверяется, что скачался именно он.
# Пусто — не проверять.
sha256 = "07a66c1166987c8963bb67925fcf0d31c26a8e0e65eae7b01d0d4783bc7f4e27"
# На чём считать нейросеть: "auto" — видеокарта NVIDIA, если есть, иначе процессор;
# "cpu" — всегда процессор; "0" — первая видеокарта NVIDIA.
device = "auto"
# Модель запускается на каждом N-м кадре (5 = 5 раз в секунду при 25 кадрах/с).
# Меньше — точнее и медленнее, больше — быстрее.
every_n_frames = 5

[geometry]
# Файл калибровки объектива (не менять без повторной калибровки).
calibration = "calibration.json"
# Вход в станок: здесь левый торец доски, пока она лежит перед проталкиванием (пиксели кадра).
machine_entry_x = 73
machine_entry_y = 862
# Поправка длины, см (прибавляется к каждой длине). 0 — без поправки.
length_correction_cm = 0.0
